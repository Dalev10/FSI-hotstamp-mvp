name: twin-java

on:
  push:
    branches: [main]
    paths: ['twin-java/**', 'contracts/**', '.github/workflows/twin.yml']
  pull_request:
    paths: ['twin-java/**', 'contracts/**', '.github/workflows/twin.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twin-java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compuerta de calidad
        run: ./mvnw -B verify
      - name: Imagen Docker
        run: docker build -t twin-java .
